services:
  ros_moveit:
    build:
      context: .
      dockerfile: Dockerfile.ros
    container_name: abb_moveit_ros
    privileged: true
    network_mode: host
    ipc: host
    volumes:
      - .:/host_workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - $HOME/.Xauthority:/root/.Xauthority:rw
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    working_dir: /workspace
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash && \
      source /workspace/install/setup.bash && \
      python3 /workspace/ros_moveit_service.py"
    depends_on:
      - streamlit_app

  robot_state_publisher:
    build:
      context: .
      dockerfile: Dockerfile.ros
    container_name: abb_robot_state_publisher
    privileged: true
    network_mode: host
    ipc: host
    volumes:
      - .:/host_workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - $HOME/.Xauthority:/root/.Xauthority:rw
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    working_dir: /workspace
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash && \
      source /workspace/install/setup.bash && \
      ros2 launch abb_crb15000_support view_crb15000_5_95.launch.py & \
      sleep 5 && python3 /workspace/simple_joint_publisher.py"

  streamlit_app:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: abb_streamlit_ui
    network_mode: host
    ipc: host
    volumes:
      - .:/host_workspace
    environment:
      - PYTHONPATH=/workspace
      - ROS_DOMAIN_ID=0
    working_dir: /workspace
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash && \
      source /workspace/install/setup.bash && \
      python3 websocket_server.py & streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0"
    depends_on:
      - robot_state_publisher

  # Optional: RViz2 service for visualization
  rviz:
    build:
      context: .
      dockerfile: Dockerfile.ros
    container_name: abb_rviz
    privileged: true
    network_mode: host
    ipc: host
    volumes:
      - .:/host_workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - $HOME/.Xauthority:/root/.Xauthority:rw
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    devices:
      - /dev/dri:/dev/dri  # For GPU access if needed
    working_dir: /workspace
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash && source /workspace/install/setup.bash && rviz2"
    profiles:
      - rviz
    depends_on:
      - ros_moveit

  # Development service for interactive shell access
  dev:
    build:
      context: .
      dockerfile: Dockerfile.ros
    container_name: abb_dev
    privileged: true
    network_mode: host
    ipc: host
    volumes:
      - .:/host_workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - $HOME/.Xauthority:/root/.Xauthority:rw
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    working_dir: /workspace
    command: /bin/bash
    stdin_open: true
    tty: true
    profiles:
      - dev
