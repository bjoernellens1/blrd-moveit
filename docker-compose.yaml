version: '3.8'

services:
  ros_moveit:
    build:
      context: .
      dockerfile: Dockerfile.ros
    container_name: abb_moveit_ros
    privileged: true
    network_mode: host
    volumes:
      - .:/host_workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - $HOME/.Xauthority:/root/.Xauthority:rw
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    working_dir: /workspace
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash && \
      source /workspace/install/setup.bash && \
      python3 /app/ros_interface.py"
    depends_on:
      - streamlit_app

  streamlit_app:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: abb_streamlit_ui
    ports:
      - "8501:8501"
      - "8765:8765"  # WebSocket port
    volumes:
      - .:/host_workspace
    environment:
      - PYTHONPATH=/workspace
    working_dir: /workspace
    command: >
      bash -c "python3 websocket_server.py & streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0"

  # Optional: RViz2 service for visualization
  rviz:
    build:
      context: .
      dockerfile: Dockerfile.ros
    container_name: abb_rviz
    privileged: true
    network_mode: host
    volumes:
      - .:/host_workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - $HOME/.Xauthority:/root/.Xauthority:rw
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    working_dir: /workspace
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash && source /workspace/install/setup.bash && rviz2"
    profiles:
      - rviz
    depends_on:
      - ros_moveit

  # Development service for interactive shell access
  dev:
    build:
      context: .
      dockerfile: Dockerfile.ros
    container_name: abb_dev
    privileged: true
    network_mode: host
    volumes:
      - .:/host_workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - $HOME/.Xauthority:/root/.Xauthority:rw
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    working_dir: /workspace
    command: /bin/bash
    stdin_open: true
    tty: true
    profiles:
      - dev
